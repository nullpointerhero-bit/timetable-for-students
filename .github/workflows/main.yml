name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    steps:
      # 1. Получение исходного кода
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Настройка Node.js 18 (без кэширования!)
      - name: Setup Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          # Убрали cache: 'npm', чтобы не тянуть поврежденный кеш

      # 3. Очистка кеша npm (на всякий случай)
      - name: Clean npm cache
        run: npm cache clean --force

      # 4. Установка зависимостей
      - name: Install dependencies
        run: npm install

      # 5. Проверка стиля кода
      - name: Run ESLint
        run: npm run lint

      # 6. Валидация HTML-разметки
      - name: Validate HTML
        run: npm run validate:html
